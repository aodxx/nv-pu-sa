name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Pages production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          # strip accidental whitespace/newlines
          CLEAN=$(printf "%s" "$TOKEN" | tr -d "\r\n" | xargs)
          echo "TOKEN_LEN=${#CLEAN}"
          if [ "${#CLEAN}" -lt 20 ]; then
            echo "::error::CLOUDFLARE_API_TOKEN looks too short"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is set"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "793f6dc7afb275fb3d03c869b1570a1a"
        run: |
          # sanitize token
          export CLOUDFLARE_API_TOKEN=$(printf "%s" "$CLOUDFLARE_API_TOKEN" | tr -d "\r\n" | xargs)
          npx wrangler pages deploy . --project-name=nv-pu-sa --branch=main
