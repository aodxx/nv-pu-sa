# Deploy static site to GitHub Pages on every push to main
# Note: GitHub Pages is STATIC only — API/Admin (D1/Functions) need Cloudflare Pages
# See docs/DEPLOY_CLOUDFLARE.md for full stack deploy

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ทั้ง repo เป็น static root (functions/ จะไม่รันบน GH Pages)
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
